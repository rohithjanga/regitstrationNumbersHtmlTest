<title>Current Program Registrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ground:        #f7f6f2;
    --surface:       #ffffff;
    --surface-alt:   #f0eee5;
    --ink:           #17140f;
    --ink-secondary: #5a564a;
    --ink-muted:     #8b8779;
    --hairline:      #e2ded2;
    --baseline:      #cac5b6;
    --accent:        #c9861a;
    --accent-tint:   #f7e6c8;
    --accent-ink:    #4a3106;
    --series:        #2a78d6;
    --series-tint:   rgba(42,120,214,0.10);
    --series-muted:  #c3d9f3;
    --good:          #006300;
    --bad:           #b42323;
    --focus-ring:     #2a78d6;
    --shadow: 0 1px 2px rgba(23,20,15,0.04), 0 8px 24px rgba(23,20,15,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:        #0c0c0b;
      --surface:       #17160f;
      --surface-alt:   #1f1d15;
      --ink:           #f7f5ef;
      --ink-secondary: #c6c1b0;
      --ink-muted:     #928d7c;
      --hairline:      #2d2a20;
      --baseline:      #3a3627;
      --accent:        #eda100;
      --accent-tint:   #3a2c0c;
      --accent-ink:    #ffd985;
      --series:        #3987e5;
      --series-tint:   rgba(57,135,229,0.16);
      --series-muted:  #2c4a72;
      --good:          #0ca30c;
      --bad:           #e66767;
      --focus-ring:     #6fa8ec;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:        #0c0c0b;
    --surface:       #17160f;
    --surface-alt:   #1f1d15;
    --ink:           #f7f5ef;
    --ink-secondary: #c6c1b0;
    --ink-muted:     #928d7c;
    --hairline:      #2d2a20;
    --baseline:      #3a3627;
    --accent:        #eda100;
    --accent-tint:   #3a2c0c;
    --accent-ink:    #ffd985;
    --series:        #3987e5;
    --series-tint:   rgba(57,135,229,0.16);
    --series-muted:  #2c4a72;
    --good:          #0ca30c;
    --bad:           #e66767;
    --focus-ring:     #6fa8ec;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ground:        #f7f6f2;
    --surface:       #ffffff;
    --surface-alt:   #f0eee5;
    --ink:           #17140f;
    --ink-secondary: #5a564a;
    --ink-muted:     #8b8779;
    --hairline:      #e2ded2;
    --baseline:      #cac5b6;
    --accent:        #c9861a;
    --accent-tint:   #f7e6c8;
    --accent-ink:    #4a3106;
    --series:        #2a78d6;
    --series-tint:   rgba(42,120,214,0.10);
    --series-muted:  #c3d9f3;
    --good:          #006300;
    --bad:           #b42323;
    --focus-ring:     #2a78d6;
    --shadow: 0 1px 2px rgba(23,20,15,0.04), 0 8px 24px rgba(23,20,15,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 28px 96px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .as-of {
    text-align: right;
    color: var(--ink-secondary);
    font-size: 13px;
    line-height: 1.5;
  }
  .as-of strong { color: var(--ink); font-weight: 600; }

  .masthead-right {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .theme-toggle {
    appearance: none;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-secondary);
    flex-shrink: 0;
    transition: color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--baseline); }
  .theme-toggle:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .theme-toggle svg { width: 17px; height: 17px; display: block; }
  /* JS sets data-mode="light"|"dark" to the CURRENT effective theme; the
     icon shown is the mode a click would switch TO. */
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
  .theme-toggle[data-mode="dark"] .icon-sun { display: block; }
  .theme-toggle[data-mode="light"] .icon-moon { display: block; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 28px;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink-muted);
    padding: 12px 18px 13px;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .tab[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .tab .count {
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .tab[aria-selected="true"] .count { color: var(--accent-ink); background: var(--accent-tint); }

  /* ---------- Stat row ---------- */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(var(--stat-cols, 3), 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 18px 20px;
  }
  .stat-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin: 0 0 8px;
  }
  .stat-value-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat-value {
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .stat-delta {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-delta.is-up { color: var(--good); }
  .stat-delta.is-down { color: var(--bad); }
  .stat-delta.is-flat { color: var(--ink-muted); font-weight: 500; }
  .stat-sub {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 8px 0 0;
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 22px 22px 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .card-title {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 4px;
  }
  .card-subtitle {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 0;
  }

  /* ---------- Highlights ---------- */
  .highlights-card { padding-bottom: 18px; }
  .highlight-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .highlight-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .highlight-dot {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-1px);
  }
  .highlight-dot.is-up { background: var(--good); }
  .highlight-dot.is-down { background: var(--bad); }
  .highlight-dot.is-new { background: var(--series); }
  .highlight-dot.is-soon { background: var(--accent); }
  .highlight-text strong { font-weight: 600; }
  .highlight-empty { color: var(--ink-muted); font-size: 13.5px; }

  /* ---------- Legend ---------- */
  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 14px;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-secondary);
    font-weight: 600;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-dot.is-series { background: var(--series); }
  .legend-dot.is-accent { background: var(--accent); }

  /* ---------- Center filter ---------- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-secondary);
  }
  .center-filter { position: relative; }
  .center-filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .center-filter-btn:hover { border-color: var(--baseline); }
  .center-filter-btn .chev { font-size: 10px; color: var(--ink-muted); }
  .center-filter-panel {
    position: absolute;
    z-index: 20;
    top: calc(100% + 6px);
    left: 0;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 12px;
  }
  .center-filter-search {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    background: var(--ground);
    color: var(--ink);
    margin-bottom: 8px;
  }
  .center-filter-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .center-filter-actions button {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--series);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .center-filter-actions button:hover { text-decoration: underline; }
  .center-filter-list {
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 6px 0;
    margin-bottom: 10px;
  }
  .center-filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 5px 2px;
    cursor: pointer;
    border-radius: 4px;
  }
  .center-filter-item:hover { background: var(--surface-alt); }
  .center-filter-item input { flex-shrink: 0; }
  .center-filter-empty { font-size: 12.5px; color: var(--ink-muted); padding: 8px 2px; }
  .center-filter-apply {
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-tint);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 8px;
    cursor: pointer;
  }
  .center-filter-apply:hover { opacity: 0.85; }

  /* ---------- Two-up chart grid ---------- */
  .chart-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .chart-grid-2 { grid-template-columns: 1fr; }
  }
  .chart-grid-2 .chart-sub-card .card-title { font-size: 14px; }

  /* ---------- Chart ---------- */
  .chart-wrap { position: relative; }
  .chart-svg { width: 100%; height: 220px; display: block; overflow: visible; }
  .bar { fill: var(--series); cursor: pointer; }
  .bar:hover, .bar.hovered { fill: var(--series); opacity: 0.82; }
  .bar.accent { fill: var(--accent); }
  .bar.accent:hover, .bar.accent.hovered { fill: var(--accent); opacity: 0.82; }
  .gridline { stroke: var(--hairline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--ink-muted); font-size: 10.5px; font-family: "Public Sans", sans-serif; }
  .ytick-label { fill: var(--ink-muted); font-size: 10.5px; font-family: "Public Sans", sans-serif; font-variant-numeric: tabular-nums; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--ground);
    font-size: 12px;
    line-height: 1.4;
    border-radius: 5px;
    padding: 7px 10px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .1s ease;
    z-index: 5;
    box-shadow: var(--shadow);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tooltip .tt-label { color: var(--ink-muted); }

  details.table-toggle { margin-top: 12px; }
  details.table-toggle summary {
    font-size: 12.5px;
    color: var(--ink-secondary);
    cursor: pointer;
    font-weight: 600;
  }
  .weekly-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  .weekly-table th, .weekly-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  .weekly-table th { color: var(--ink-muted); font-weight: 600; }

  /* ---------- Table ---------- */
  .table-scroll { overflow-x: auto; overflow-y: auto; max-height: 620px; }
  table.programs {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.programs th {
    text-align: left;
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0 12px 10px 0;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--surface);
    padding-top: 8px;
    z-index: 1;
  }
  table.programs th button {
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  table.programs th button:hover { color: var(--ink); }
  table.programs th button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .sort-arrow { font-size: 9px; opacity: 0.5; }
  .sort-arrow.active { opacity: 1; color: var(--accent); }
  table.programs td {
    padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--hairline);
    color: var(--ink);
    vertical-align: top;
  }
  table.programs tbody tr:last-child td { border-bottom: none; }

  /* Pin the program-name column while the table scrolls horizontally through week columns */
  table.programs .sticky-col {
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 1;
    box-shadow: 1px 0 0 var(--hairline);
    padding-right: 16px;
  }
  table.programs th.sticky-col { z-index: 2; }

  .week-divider { border-left: 1px solid var(--hairline); }
  .week-col-head {
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
  }
  .week-count { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-secondary); }
  .week-count.has-data { color: var(--ink); }
  .week-count.na { color: var(--ink-muted); }
  .prog-name { font-weight: 600; }
  .prog-center { color: var(--ink-secondary); font-size: 12.5px; }
  .num-cell { font-variant-numeric: tabular-nums; text-align: right; }
  table.programs th.num-col { text-align: right; }
  .days-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .days-badge .n { font-size: 13.5px; }
  .soon-chip {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent-tint);
    border-radius: 999px;
    padding: 2px 8px;
    vertical-align: middle;
  }

  .new-chip {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--series);
    background: var(--series-tint);
    border-radius: 999px;
    padding: 2px 8px;
    vertical-align: middle;
  }

  .row-delta {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .row-delta.is-up { color: var(--good); }
  .row-delta.is-down { color: var(--bad); }
  .row-delta.is-flat { color: var(--ink-muted); font-weight: 400; }

  .spark-cell { min-width: 132px; }
  .spark-svg { display: block; overflow: visible; }
  .spark-bar { fill: var(--series-muted); }
  .spark-bar.current { fill: var(--series); }
  .spark-empty { color: var(--ink-muted); font-size: 12px; }
  .spark-caption { font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; }

  .empty-note { color: var(--ink-muted); font-size: 13px; padding: 20px 0; }

  footer.note {
    color: var(--ink-muted);
    font-size: 12px;
    margin-top: 8px;
  }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: 1fr; }
    .as-of { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="page">
  <div class="masthead">
    <div>
      <p class="eyebrow">Program Operations</p>
      <h1>Current Program Registrations</h1>
    </div>
    <div class="masthead-right">
      <div class="as-of">Snapshot as of<br><strong id="asOfDate">—</strong></div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark view">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <line x1="12" y1="1.8" x2="12" y2="4.4"></line>
          <line x1="12" y1="19.6" x2="12" y2="22.2"></line>
          <line x1="4.4" y1="4.4" x2="6.2" y2="6.2"></line>
          <line x1="17.8" y1="17.8" x2="19.6" y2="19.6"></line>
          <line x1="1.8" y1="12" x2="4.4" y2="12"></line>
          <line x1="19.6" y1="12" x2="22.2" y2="12"></line>
          <line x1="4.4" y1="19.6" x2="6.2" y2="17.8"></line>
          <line x1="17.8" y1="6.2" x2="19.6" y2="4.4"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.4A8.4 8.4 0 1 1 9.6 3.8a6.6 6.6 0 0 0 10.6 10.6Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>

<script>

  var state = { tab: "meditators", sortKey: "total", sortDir: "desc", sortKey2: "start", sortDir2: "desc", medCenters: null, fmCenters: null };

  function fmtInt(n) {
    return n.toLocaleString("en-US");
  }

  function fmtDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }

  function addDays(iso, n) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function fmtDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function fmtDateMid(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  function fmtDateShortYear(iso) {
    var d = new Date(iso + "T00:00:00");
    var month = d.toLocaleDateString("en-US", { month: "short" });
    var yy = String(d.getFullYear()).slice(-2);
    return month + " " + d.getDate() + " '" + yy;
  }

  document.getElementById("asOfDate").textContent = fmtDateLong(TODAY);

  // ---------- Theme toggle ----------
  (function () {
    var STORAGE_KEY = "theme-preference";
    var root = document.documentElement;
    var toggle = document.getElementById("themeToggle");

    function readStored() {
      try {
        var v = window.localStorage.getItem(STORAGE_KEY);
        return (v === "light" || v === "dark") ? v : null;
      } catch (e) {
        return null;
      }
    }
    function writeStored(v) {
      try { window.localStorage.setItem(STORAGE_KEY, v); } catch (e) {}
    }
    function systemPrefersDark() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function effectiveTheme() {
      var explicit = root.getAttribute("data-theme");
      if (explicit === "light" || explicit === "dark") return explicit;
      return systemPrefersDark() ? "dark" : "light";
    }
    function updateToggle() {
      var mode = effectiveTheme();
      toggle.setAttribute("data-mode", mode);
      toggle.setAttribute("aria-label", mode === "dark" ? "Switch to light view" : "Switch to dark view");
    }

    var stored = readStored();
    if (stored) root.setAttribute("data-theme", stored);
    updateToggle();

    toggle.addEventListener("click", function () {
      var next = effectiveTheme() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      writeStored(next);
      updateToggle();
    });

    if (!stored && window.matchMedia) {
      try {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
          if (!readStored()) updateToggle();
        });
      } catch (e) {}
    }
  })();

  // ---------- Weekly chart ----------
  function buildChart(weekly, opts) {
    opts = opts || {};
    var unitLabel = opts.unitLabel || "registrations";
    var ariaLabel = opts.ariaLabel || ("Weekly " + unitLabel + " bar chart");
    var colorClass = opts.colorClass || "";
    var xLabelFmt = opts.xLabelFmt || function (w) { return fmtDateShort(w.start); };

    var wrap = document.createElement("div");
    wrap.className = "chart-wrap";

    var svgNS = "http://www.w3.org/2000/svg";
    var W = 1000, H = 220;
    var padL = 34, padR = 6, padT = 10, padB = 26;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;

    var maxVal = 0;
    weekly.forEach(function (w) { if (w.count > maxVal) maxVal = w.count; });
    var niceMax = niceCeil(maxVal);

    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("class", "chart-svg");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", ariaLabel);

    // gridlines + y ticks (0, mid, max)

    ticks.forEach(function (tickVal) {

      var line = document.createElementNS(svgNS, "line");

      line.setAttribute("x2", W - padR);
      line.setAttribute("y1", y);

      var label = document.createElementNS(svgNS, "text");
      label.setAttribute("x", padL - 8);
      label.setAttribute("y", y + 3.5);
      label.setAttribute("text-anchor", "end");
      label.setAttribute("class", "ytick-label");
      label.textContent = fmtInt(Math.round(tickVal));
      svg.appendChild(label);
    });

    var n = weekly.length;
    var slot = plotW / n;
    var barW = Math.min(22, slot * 0.62);

    var labelEvery = Math.max(1, Math.ceil(n / 10));

    weekly.forEach(function (w, i) {
      var cx = padL + slot * i + slot / 2;

      hit.setAttribute("height", plotH);

        xl.setAttribute("text-anchor", "middle");
        xl.setAttribute("class", "axis-label");

      tooltip.innerHTML = "";
      var line1 = document.createElement("div");
      var valueSpan = document.createElement("span");
      valueSpan.className = "tt-value";
      valueSpan.textContent = fmtInt(w.count);
      line1.appendChild(valueSpan);
      var labelSpan = document.createElement("span");
      labelSpan.className = "tt-label";
      labelSpan.textContent = " " + unitLabel;
      line1.appendChild(labelSpan);
      tooltip.appendChild(line1);

      var line2 = document.createElement("div");
      line2.className = "tt-label";
      line2.textContent = opts.rangeFmt ? opts.rangeFmt(w) : (fmtDateShort(w.start) + " – " + fmtDateShort(w.end));
      tooltip.appendChild(line2);

      var wrapRect = wrap.getBoundingClientRect();
      var svgRect = svg.getBoundingClientRect();
      var scaleX = svgRect.width / W;
      var cx = padL + slot * idx + slot / 2;
      var barTop = padT + plotH - (niceMax > 0 ? (w.count / niceMax) * plotH : 0);

      tooltip.style.left = (cx * scaleX) + "px";
      tooltip.style.top = (barTop * (svgRect.height / H) - 8) + "px";
      tooltip.classList.add("visible");
    }
    function hideTooltip() {
      tooltip.classList.remove("visible");
      svg.querySelectorAll('rect.bar').forEach(function (r) { r.classList.remove("hovered"); });
    }

    svg.addEventListener("pointermove", function (evt) {
      var target = evt.target;
      if (target && target.dataset && target.dataset.index !== undefined) {
        showTooltip(parseInt(target.dataset.index, 10), evt);
      }
    });
    svg.addEventListener("pointerleave", hideTooltip);

    return wrap;
  }

  function niceCeil(v) {
    if (v <= 0) return 4;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) {
      var candidate = steps[i] * mag;
      if (candidate >= v) return candidate;
    }
    return 10 * mag;
  }

  // ---------- Per-program sparkline (weekly registrations since program opened) ----------
  function buildSparkline(weekly) {
    var box = document.createElement("div");
    if (!weekly || weekly.length === 0) {
      box.className = "spark-empty";
      box.textContent = "—";
      return box;
    }

    var svgNS = "http://www.w3.org/2000/svg";
    var W = 120, H = 26;
    var n = weekly.length;
    var slot = W / n;
    var barW = Math.max(2, Math.min(9, slot * 0.7));
    var maxVal = 0;
    weekly.forEach(function (w) { if (w.count > maxVal) maxVal = w.count; });

    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("class", "spark-svg");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label",
      "Weekly registrations since the program opened, " + weekly.length + " week" + (weekly.length === 1 ? "" : "s") +
      ", most recent week " + weekly[weekly.length - 1].count + ".");

    weekly.forEach(function (w, i) {
      var cx = slot * i + slot / 2;
      var h = maxVal > 0 ? (w.count / maxVal) * (H - 2) : 0;
      var y = H - h;
      var rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", cx - barW / 2);
      rect.setAttribute("y", y);
      rect.setAttribute("width", barW);
      rect.setAttribute("height", Math.max(h, w.count > 0 ? 1.5 : 0));
      rect.setAttribute("rx", Math.min(2, barW / 2));
      rect.setAttribute("class", "spark-bar" + (i === weekly.length - 1 ? " current" : ""));

      var titleEl = document.createElementNS(svgNS, "title");
      titleEl.textContent = fmtDateShort(w.start) + " – " + fmtDateShort(w.end) + ": " + fmtInt(w.count) + " registration" + (w.count === 1 ? "" : "s");
      rect.appendChild(titleEl);

      svg.appendChild(rect);
    });

    box.appendChild(svg);

    var caption = document.createElement("div");
    caption.className = "spark-caption";
    caption.textContent = weekly.length + " wk since open";
    box.appendChild(caption);

    return box;
  }

  // ---------- Programs table ----------
  function sortPrograms(programs, key, dir) {
    var mult = dir === "asc" ? 1 : -1;
    var copy = programs.slice();
    copy.sort(function (a, b) {
      var av = a[key], bv = b[key];
      if (av === null || av === undefined) av = Infinity;
      if (bv === null || bv === undefined) bv = Infinity;
      if (typeof av === "string") {
        return av.localeCompare(bv) * mult;
      }
      return (av - bv) * mult;
    });
    return copy;
  }

  function buildTable(programs, showCenter, groupWeekly) {
    var eligible = programs.filter(function (p) { return !p.is_evergreen; });
    var excludedCount = programs.length - eligible.length;

    var sorted = sortPrograms(eligible, state.sortKey, state.sortDir);

    var wrap = document.createElement("div");

    if (sorted.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = "No programs with a scheduled start date in this view.";
      wrap.appendChild(empty);
      return wrap;
    }

    // Week columns run newest-first, right of Registrations — same buckets as the sparkline/chart above.
    var weekIndexesDesc = [];
    for (var wi = groupWeekly.length - 1; wi >= 0; wi--) weekIndexesDesc.push(wi);

    var scroll = document.createElement("div");
    scroll.className = "table-scroll";
    var table = document.createElement("table");
    table.className = "programs";

    var cols = [
      { key: "name", label: "Program", align: "left", sticky: true },
    ];
    if (showCenter) cols.push({ key: "center", label: "Center", align: "left" });
    cols.push({ key: "weekly", label: "Weekly registrations since open", align: "left", sortable: false });
    cols.push({ key: "start", label: "Start date", align: "left" });
    cols.push({ key: "days_until_start", label: "Days until start", align: "right" });
    cols.push({ key: "total_regs", label: "Registrations", align: "right" });
    cols.push({ key: "regs_delta", label: "vs yesterday", align: "right" });

    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    cols.forEach(function (col) {
      var th = document.createElement("th");
      if (col.align === "right") th.classList.add("num-col");
      if (col.sticky) th.classList.add("sticky-col");
      if (col.sortable === false) {
        th.textContent = col.label;
        htr.appendChild(th);
        return;
      }
      var btn = document.createElement("button");
      btn.type = "button";
      var labelNode = document.createTextNode(col.label + " ");
      btn.appendChild(labelNode);
      var arrow = document.createElement("span");
      arrow.className = "sort-arrow" + (state.sortKey === col.key ? " active" : "");
      arrow.textContent = state.sortKey === col.key ? (state.sortDir === "asc" ? "▲" : "▼") : "▲▼";
      btn.appendChild(arrow);
      btn.addEventListener("click", function () {
        if (state.sortKey === col.key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = col.key;
          state.sortDir = "asc";
        }
        render();
      });
      th.appendChild(btn);
      htr.appendChild(th);
    });
    // Week-by-week count columns, one per calendar week, newest first.
    weekIndexesDesc.forEach(function (wi, pos) {
      var wk = groupWeekly[wi];
      var th = document.createElement("th");
      th.className = "num-col week-col-head" + (pos === 0 ? " week-divider" : "");
      th.textContent = fmtDateShortYear(wk.start);
      th.title = fmtDateMid(wk.start) + " – " + fmtDateMid(wk.end);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    sorted.forEach(function (p) {
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.className = "sticky-col";
      var nameSpan = document.createElement("span");
      nameSpan.className = "prog-name";
      nameSpan.textContent = p.name;
      tdName.appendChild(nameSpan);
      if (p.is_new) {
        var newChip = document.createElement("span");
        newChip.className = "new-chip";
        newChip.textContent = "New";
        newChip.title = "Wasn't an open, tracked program as of yesterday's data";
        tdName.appendChild(newChip);
      }
      tr.appendChild(tdName);

      if (showCenter) {
        var tdCenter = document.createElement("td");
        tdCenter.className = "prog-center";
        tdCenter.textContent = p.center;
        tr.appendChild(tdCenter);
      }

      var tdSpark = document.createElement("td");
      tdSpark.className = "spark-cell";
      tdSpark.appendChild(buildSparkline(p.weekly));
      tr.appendChild(tdSpark);

      var tdStart = document.createElement("td");
      tdStart.textContent = p.start ? fmtDateMid(p.start) : "—";
      tr.appendChild(tdStart);

      var tdDays = document.createElement("td");
      tdDays.className = "num-cell";
      var badge = document.createElement("span");
      badge.className = "days-badge";
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = p.days_until_start !== null ? fmtInt(p.days_until_start) : "—";
      badge.appendChild(n);
      tdDays.appendChild(badge);
      if (p.days_until_start !== null && p.days_until_start <= 7) {
        var chip = document.createElement("span");
        chip.className = "soon-chip";
        chip.textContent = "Soon";
        tdDays.appendChild(chip);
      }
      tr.appendChild(tdDays);

      var tdRegs = document.createElement("td");
      tdRegs.className = "num-cell";
      tdRegs.textContent = fmtInt(p.total_regs);
      tr.appendChild(tdRegs);

      var tdDelta = document.createElement("td");
      tdDelta.className = "num-cell";
      var deltaSpan = document.createElement("span");
      var rdir = p.regs_delta > 0 ? "up" : (p.regs_delta < 0 ? "down" : "flat");
      deltaSpan.className = "row-delta is-" + rdir;
      var rArrow = rdir === "up" ? "▲" : (rdir === "down" ? "▼" : "•");
      var rSigned = (p.regs_delta > 0 ? "+" : "") + fmtInt(p.regs_delta);
      deltaSpan.textContent = rdir === "flat" ? "•" : (rArrow + " " + rSigned);
      deltaSpan.title = (rdir === "flat" ? "No change" : rSigned) + " vs yesterday";
      tdDelta.appendChild(deltaSpan);
      tr.appendChild(tdDelta);

      // Week-by-week counts, aligned to the same columns as the header (newest first).
      // Null means the program hadn't opened yet during that week.
      weekIndexesDesc.forEach(function (wi, pos) {
        var tdWeek = document.createElement("td");
        tdWeek.className = "week-count" + (pos === 0 ? " week-divider" : "");
        var val = p.weekly_aligned ? p.weekly_aligned[wi] : null;
        if (val === null || val === undefined) {
          tdWeek.classList.add("na");
          tdWeek.textContent = "–";
        } else {
          if (val > 0) tdWeek.classList.add("has-data");
          tdWeek.textContent = fmtInt(val);
        }
        tr.appendChild(tdWeek);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);

    var footNote = document.createElement("footer");
    footNote.className = "note";
    var footParts = [];
    if (excludedCount > 0) {
      footParts.push(excludedCount + " ongoing / self-paced program" + (excludedCount === 1 ? "" : "s") +
        " with no fixed start date " + (excludedCount === 1 ? "is" : "are") + " excluded from this list and from the totals above.");
    }
    var newCount = eligible.filter(function (p) { return p.is_new; }).length;
    if (newCount > 0) {
      footParts.push(newCount + " program" + (newCount === 1 ? "" : "s") + " marked “New” " + (newCount === 1 ? "wasn't" : "weren't") + " open and tracked as of yesterday's data.");
    }
    footParts.push("“–” in a week column means the program hadn’t opened yet that week.");
    footNote.textContent = footParts.join(" ");
    wrap.appendChild(footNote);

    return wrap;
  }

  // ---------- Weekly detail table (accessible fallback) ----------
  function buildWeeklyTable(weekly) {
    var details = document.createElement("details");
    details.className = "table-toggle";

  // ---------- Highlights (what changed since yesterday) ----------
  function buildHighlights(g, tabDef) {
    var eligible = g.programs.filter(function (p) { return !p.is_evergreen; });
    var yesterdayLabel = fmtDateShort(addDays(TODAY, -1));
    var items = [];

    if (g.total_regs_delta !== 0) {
      var totalUp = g.total_regs_delta > 0;
      items.push({
        dot: totalUp ? "is-up" : "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("Total registrations " + (totalUp ? "up " : "down ")));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(Math.abs(g.total_regs_delta));
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" since " + yesterdayLabel + "."));
        }
      });
    }

    var newOnes = eligible.filter(function (p) { return p.is_new; });
    if (newOnes.length > 0) {
      items.push({
        dot: "is-new",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = newOnes.length + " new program" + (newOnes.length === 1 ? "" : "s");
          row.appendChild(strong);
          var names = newOnes.slice(0, 2).map(function (p) {
            return p.name + (p.start ? " (" + fmtDateShort(p.start) + ")" : "");
          }).join(", ");
          var extra = newOnes.length > 2 ? " +" + (newOnes.length - 2) + " more" : "";
          row.appendChild(document.createTextNode(" opened: " + names + extra + "."));
        }
      });
    }

    var movers = eligible
      .filter(function (p) { return p.regs_delta > 0; })
      .sort(function (a, b) { return b.regs_delta - a.regs_delta; });
    if (movers.length > 0) {
      var top = movers[0];
      var topNameCount = eligible.filter(function (p) { return p.name === top.name; }).length;
      items.push({
        dot: "is-up",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = top.name + (topNameCount > 1 && top.start ? " (" + fmtDateShort(top.start) + ")" : "");
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" led with +" + fmtInt(top.regs_delta) + " registration" + (top.regs_delta === 1 ? "" : "s") + " since yesterday."));
        }
      });
    }

    var soon = eligible.filter(function (p) {
      return p.days_until_start !== null && p.days_until_start >= 0 && p.days_until_start <= 7;
    });
    if (soon.length > 0) {
      items.push({
        dot: "is-soon",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = soon.length + " program" + (soon.length === 1 ? "" : "s");
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" start" + (soon.length === 1 ? "s" : "") + " within 7 days."));
        }
      });
    }

    return buildHighlightsCard(
      "What changed since " + yesterdayLabel + " · " + tabDef.label,
      "No changes since " + yesterdayLabel + ".",
      items
    );
  }

  function buildHighlightsCard(subtitleText, emptyText, items) {
    var card = document.createElement("div");
    card.className = "card highlights-card";
    card.appendChild(buildCardHead("Highlights", subtitleText));

    if (items.length === 0) {
      var empty = document.createElement("p");
      empty.className = "highlight-empty";
      empty.textContent = emptyText;
      card.appendChild(empty);
    } else {
      var list = document.createElement("div");
      list.className = "highlight-list";
      items.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "highlight-item";
        var dot = document.createElement("span");
        dot.className = "highlight-dot " + item.dot;
        row.appendChild(dot);
        var text = document.createElement("span");
        text.className = "highlight-text";
        item.build(text);
        row.appendChild(text);
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    return card;
  }

  function buildCardHead(titleText, subtitleText) {
    var head = document.createElement("div");
    head.className = "card-head";
    var titleWrap = document.createElement("div");
    var title = document.createElement("p");
    title.className = "card-title";
    title.textContent = titleText;
    titleWrap.appendChild(title);
    if (subtitleText) {
      var sub = document.createElement("p");
      sub.className = "card-subtitle";
      sub.textContent = subtitleText;
      titleWrap.appendChild(sub);
    }
    head.appendChild(titleWrap);
    return head;
  }

  function buildStatRow(stats) {
    var statRow = document.createElement("div");
    statRow.className = "stat-row";
    statRow.style.setProperty("--stat-cols", stats.length);
    stats.forEach(function (s) {
      var tile = document.createElement("div");
      tile.className = "stat-tile";
      var lab = document.createElement("p");
      lab.className = "stat-label";
      lab.textContent = s.label;

      var valueRow = document.createElement("div");
      valueRow.className = "stat-value-row";
      var val = document.createElement("p");
      val.className = "stat-value";
      val.textContent = s.value;
      valueRow.appendChild(val);

      if (s.delta !== undefined && s.delta !== null) {
        var delta = document.createElement("span");
        var dir = s.delta > 0 ? "up" : (s.delta < 0 ? "down" : "flat");
        delta.className = "stat-delta is-" + dir;
        var arrow = dir === "up" ? "▲" : (dir === "down" ? "▼" : "•");
        var signed = (s.delta > 0 ? "+" : "") + fmtInt(s.delta);
        delta.textContent = arrow + " " + (dir === "flat" ? "No change" : signed) + " vs " + s.deltaVsLabel;
        valueRow.appendChild(delta);
      }

      var sub = document.createElement("p");
      sub.className = "stat-sub";
      sub.textContent = s.sub;
      tile.appendChild(lab);
      tile.appendChild(valueRow);
      tile.appendChild(sub);
      statRow.appendChild(tile);
    });
    return statRow;
  }

  function buildLegendRow(items) {
    // items: [{ cls: "is-series"|"is-accent", label: "IE" }, ...]
    var row = document.createElement("div");
    row.className = "legend-row";
    items.forEach(function (it) {
      var chip = document.createElement("span");
      chip.className = "legend-chip";
      var dot = document.createElement("span");
      dot.className = "legend-dot " + it.cls;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(it.label));
      row.appendChild(chip);
    });
    return row;
  }

  function fmtMonthShort(ym) {
    // ym like "2026-09"
    var parts = ym.split("-");
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    var month = d.toLocaleDateString("en-US", { month: "short" });
    var yy = String(d.getFullYear()).slice(-2);
    return month + " '" + yy;
  }

  function buildGenericTable(rows, sortKey, sortDir, onSort, cols, emptyText) {
    var sorted = sortPrograms(rows, sortKey, sortDir);
    var wrap = document.createElement("div");

    if (sorted.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = emptyText || "No data available.";
      wrap.appendChild(empty);
      return wrap;
    }

    var scroll = document.createElement("div");
    scroll.className = "table-scroll";
    var table = document.createElement("table");
    table.className = "programs";

    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    cols.forEach(function (col) {
      var th = document.createElement("th");
      if (col.align === "right") th.classList.add("num-col");
      if (col.sticky) th.classList.add("sticky-col");
      if (col.sortable === false) {
        th.textContent = col.label;
        htr.appendChild(th);
        return;
      }
      var btn = document.createElement("button");
      btn.type = "button";
      btn.appendChild(document.createTextNode(col.label + " "));
      var arrow = document.createElement("span");
      arrow.className = "sort-arrow" + (sortKey === col.key ? " active" : "");
      arrow.textContent = sortKey === col.key ? (sortDir === "asc" ? "▲" : "▼") : "▲▼";
      btn.appendChild(arrow);
      btn.addEventListener("click", function () { onSort(col.key); });
      th.appendChild(btn);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    sorted.forEach(function (row) {
      var tr = document.createElement("tr");
      cols.forEach(function (col) {
        var td = document.createElement("td");
        if (col.align === "right") td.classList.add("num-cell");
        if (col.sticky) td.classList.add("sticky-col");
        if (col.render) {
          col.render(td, row);
        } else {
          td.textContent = row[col.key];
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  // ---------- Center filter dropdown ----------
  function buildCenterDropdown(allCenters, selected, onApply) {
    // allCenters: sorted array of center name strings
    // selected: Set of selected names, or null meaning "all centers"
    var wrap = document.createElement("div");
    wrap.className = "center-filter";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "center-filter-btn";
    var btnLabel = document.createElement("span");
    var chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = "▾";
    btn.appendChild(btnLabel);
    btn.appendChild(chev);

    function updateBtnLabel() {
      if (!selected || selected.size === 0 || selected.size === allCenters.length) {
        btnLabel.textContent = "All centers";
      } else if (selected.size === 1) {
        var only;
        selected.forEach(function (c) { only = c; });
        btnLabel.textContent = only;
      } else {
        btnLabel.textContent = selected.size + " centers selected";
      }
    }
    updateBtnLabel();
    wrap.appendChild(btn);

    var panel = document.createElement("div");
    panel.className = "center-filter-panel";
    panel.hidden = true;

    var searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = "Search centers…";
    searchInput.className = "center-filter-search";
    panel.appendChild(searchInput);

    var actionsRow = document.createElement("div");
    actionsRow.className = "center-filter-actions";
    var selectAllBtn = document.createElement("button");
    selectAllBtn.type = "button";
    selectAllBtn.textContent = "Select all";
    var clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "Clear";
    actionsRow.appendChild(selectAllBtn);
    actionsRow.appendChild(clearBtn);
    panel.appendChild(actionsRow);

    var listWrap = document.createElement("div");
    listWrap.className = "center-filter-list";
    panel.appendChild(listWrap);

    var workingSet = selected ? new Set(selected) : new Set(allCenters);

    function renderList(filterText) {
      listWrap.innerHTML = "";
      var ft = (filterText || "").toLowerCase();
      var shown = 0;
      allCenters.forEach(function (c) {
        if (ft && c.toLowerCase().indexOf(ft) === -1) return;
        shown++;
        var label = document.createElement("label");
        label.className = "center-filter-item";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = workingSet.has(c);
        cb.addEventListener("change", function () {
          if (cb.checked) workingSet.add(c); else workingSet.delete(c);
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + c));
        listWrap.appendChild(label);
      });
      if (shown === 0) {
        var empty = document.createElement("p");
        empty.className = "center-filter-empty";
        empty.textContent = "No centers match.";
        listWrap.appendChild(empty);
      }
    }
    renderList("");

    searchInput.addEventListener("input", function () { renderList(searchInput.value); });
    selectAllBtn.addEventListener("click", function () {
      allCenters.forEach(function (c) { workingSet.add(c); });
      renderList(searchInput.value);
    });
    clearBtn.addEventListener("click", function () {
      workingSet.clear();
      renderList(searchInput.value);
    });

    var applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "center-filter-apply";
    applyBtn.textContent = "Apply";
    applyBtn.addEventListener("click", function () {
      panel.hidden = true;
      var newSelected = (workingSet.size === 0 || workingSet.size === allCenters.length) ? null : new Set(workingSet);
      onApply(newSelected);
    });
    panel.appendChild(applyBtn);

    wrap.appendChild(panel);

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      panel.hidden = !panel.hidden;
      if (!panel.hidden) searchInput.focus();
    });
    document.addEventListener("click", function (e) {
      if (!wrap.contains(e.target)) panel.hidden = true;
    });

    return wrap;
  }

  function buildFilterBar(allCenters, selected, onApply) {
    var bar = document.createElement("div");
    bar.className = "filter-bar";

  // ---------- Per-center data filtering ----------
  function sumMonthlyByCenter(records, months, valueField, selectedCenters) {
    var out = {};
    months.forEach(function (m) { out[m] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (out.hasOwnProperty(r.m)) out[r.m] += r[valueField];
    });
    return months.map(function (m) { return out[m]; });
  }

  function sumWeeklyByCenter(records, weekStarts, valueField, selectedCenters) {
    var out = {};
    weekStarts.forEach(function (w) { out[w] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (out.hasOwnProperty(r.w)) out[r.w] += r[valueField];
    });
    return weekStarts.map(function (w) { return out[w]; });
  }

  function sumYearlyByCenter(records, years, valueField, selectedCenters) {
    var out = {};
    years.forEach(function (y) { out[y] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      var y = r.m.slice(0, 4);
      if (out.hasOwnProperty(y)) out[y] += r[valueField];
    });
    return years.map(function (y) { return out[y]; });
  }

    grid.appendChild(leadsSub);

    var ieSub = document.createElement("div");
    ieSub.className = "chart-sub-card";
    ieSub.appendChild(buildCardHead("Registered for IE"));
    ieSub.appendChild(buildChart(
      monthsList.map(function (mk, i) { return { start: mk, end: mk, count: monthlyIeCounts[i] }; }),
      { unitLabel: "registrations", ariaLabel: "Monthly IE registrations", colorClass: "accent", xLabelFmt: function (w) { return fmtMonthShort(w.start); }, rangeFmt: function (w) { return fmtMonthShort(w.start); } }
    ));
    grid.appendChild(ieSub);

    chartCard.appendChild(grid);
    content.appendChild(chartCard);

    var weeklyChartCard = document.createElement("div");
    weeklyChartCard.className = "card";
    var weeklyFirst = d.weekly_leads[0];
    var weeklyLast = d.weekly_leads[d.weekly_leads.length - 1];
    weeklyChartCard.appendChild(buildCardHead("Weekly leads & IE registrations", fmtDateMid(weeklyFirst.start) + " – " + fmtDateMid(weeklyLast.end) + filterSuffix));
    weeklyChartCard.appendChild(buildLegendRow([{ cls: "is-series", label: "Leads" }, { cls: "is-accent", label: "Registered for IE" }]));

    var weeklyGrid = document.createElement("div");
    weeklyGrid.className = "chart-grid-2";

    var weeklyLeadsSub = document.createElement("div");
    weeklyLeadsSub.className = "chart-sub-card";
    weeklyLeadsSub.appendChild(buildCardHead("Leads"));
    weeklyLeadsSub.appendChild(buildChart(weeklyLeadsData, { unitLabel: "leads", ariaLabel: "Weekly leads" }));
    weeklyGrid.appendChild(weeklyLeadsSub);

    var weeklyIeSub = document.createElement("div");
    weeklyIeSub.className = "chart-sub-card";
    weeklyIeSub.appendChild(buildCardHead("Registered for IE"));
    weeklyIeSub.appendChild(buildChart(weeklyIeData, { unitLabel: "registrations", ariaLabel: "Weekly IE registrations", colorClass: "accent" }));
    weeklyGrid.appendChild(weeklyIeSub);

    weeklyChartCard.appendChild(weeklyGrid);
    content.appendChild(weeklyChartCard);

    var weeklyTableCard = document.createElement("div");
    weeklyTableCard.className = "card";
    weeklyTableCard.appendChild(buildCardHead("Weekly breakdown", weeklyLeadsData.length + " weeks · sort any column" + filterSuffix));
    var weeklyCols = [
      { key: "start", label: "Week of", align: "left", sticky: true, render: function (td, row) { td.textContent = fmtDateMid(row.start); } },
      { key: "leads", label: "Leads", align: "right" },
      { key: "ie", label: "Registered for IE", align: "right" }
    ];
    var weeklyRows = weeklyLeadsData.map(function (r, i) { return { start: r.start, end: r.end, leads: r.count, ie: weeklyIeData[i].count }; });
    weeklyTableCard.appendChild(buildGenericTable(weeklyRows, state.sortKey2, state.sortDir2, function (key) {
      state.sortDir2 = (state.sortKey2 === key) ? (state.sortDir2 === "asc" ? "desc" : "asc") : "desc";
      state.sortKey2 = key;
      render();
    }, weeklyCols));
    content.appendChild(weeklyTableCard);

    var tableCard = document.createElement("div");
    tableCard.className = "card";
    tableCard.appendChild(buildCardHead("Leads by center", filteredCenters.length + " center(s) · sort any column"));
    var cols = [
      { key: "center", label: "Center", align: "left", sticky: true },
      { key: "leads", label: "Total leads", align: "right" },
      { key: "ie", label: "Registered for IE", align: "right" },
      { key: "conversion", label: "Conversion", align: "right", render: function (td, row) { td.textContent = row.conversion + "%"; } }
    ];
    tableCard.appendChild(buildGenericTable(filteredCenters, state.sortKey, state.sortDir, function (key) {
      state.sortDir = (state.sortKey === key) ? (state.sortDir === "asc" ? "desc" : "asc") : (key === "center" ? "asc" : "desc");
      state.sortKey = key;
      render();
    }, cols));
    content.appendChild(tableCard);
  }

  function render() {
    setActiveTab();
    var tabDef = TAB_DEFS.filter(function (t) { return t.key === state.tab; })[0];
    var content = document.getElementById("content");
    content.innerHTML = "";

    if (tabDef.type === "website") {
      renderWebsiteTab(content, tabDef);
    } else if (tabDef.type === "meditators") {
      renderMeditatorsTab(content, tabDef);
    } else if (tabDef.type === "non_meditators") {
      renderNonMeditatorsTab(content, tabDef);
    } else {
      renderProgramsTab(content, tabDef);
    }
  }

  render();
})();
</script>
